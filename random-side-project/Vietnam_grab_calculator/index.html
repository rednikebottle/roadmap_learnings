<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Saigon Ride Calculator</title>
  <meta name="description" content="Estimate GrabBike and GrabCar fares between places in Ho Chi Minh City, split costs per person, and total up your daily ride spend.">
  <meta name="theme-color" content="#00b14f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛵</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">🛵</span>
      <div>
        <h1>Saigon Ride Calculator</h1>
        <p>Grab fare estimates for Ho Chi Minh City</p>
      </div>
    </div>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="Currency">
        <button data-currency="VND">₫</button>
        <button data-currency="USD">US$</button>
        <button data-currency="SGD">S$</button>
      </div>
      <button class="icon-btn" data-action="share" title="Copy share link" aria-label="Share">🔗</button>
      <button class="icon-btn" data-action="settings" title="Rates & settings" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <main>
    <div id="trips" class="trips"></div>
    <p class="disclaimer">
      Estimates only. Not affiliated with Grab. Real fares change with demand, so check the app before you book.
      <button class="link" data-action="settings">Rates &amp; sources</button> ·
      <button class="link" data-action="clear-all">Clear all trips</button>
    </p>
  </main>

  <button class="fab" data-action="add" aria-label="Add trip">+</button>

  <footer id="totals" class="totals" aria-live="polite"></footer>

  <div id="editor" class="editor" hidden role="dialog" aria-modal="true" aria-label="Edit trip"></div>
  <div id="map-home" hidden><div id="map"></div></div>

  <dialog id="settings">
    <div class="dlg-head">
      <h2>Rates &amp; settings</h2>
      <button class="icon-btn" data-action="close-settings" aria-label="Close">✕</button>
    </div>
    <div id="settings-body" class="dlg-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/pricing.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
